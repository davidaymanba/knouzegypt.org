name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key of the Hostinger server (178.16.128.8:65002)
          echo "[178.16.128.8]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF7+cavMeljUupg4DLHU5RgthHSa1YJqiYtB1jb7fYiW" > ~/.ssh/known_hosts

      - name: Upload site
        run: |
          rsync -rlvz --chmod=D755,F644 \
            -e "ssh -p 65002 -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            --exclude ".git*" \
            --exclude "public_html/" \
            --exclude "training of leaders /" \
            --exclude ".DS_Store" \
            --exclude "DO_NOT_UPLOAD_HERE" \
            --exclude "README-UPLOAD.txt" \
            ./ u960306846@178.16.128.8:domains/knouzegypt.org/public_html/
